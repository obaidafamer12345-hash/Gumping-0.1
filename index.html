<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816"><title>Epix Jump V3 — ULTRA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;color:#fff;font-family:system-ui,Segoe UI,Tahoma,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:auto}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#020617ee,#111827ee)}
.panel{width:min(94vw,720px);max-height:94vh;overflow:auto;padding:26px;border:1px solid #ffffff20;border-radius:28px;background:#07112bf7;box-shadow:0 30px 100px #000c;text-align:center;backdrop-filter:blur(20px)}
.logo{font-size:clamp(42px,8vw,78px);font-weight:1000;background:linear-gradient(90deg,#67e8f9,#818cf8,#e879f9,#fbbf24);-webkit-background-clip:text;color:transparent}
button{font:inherit;color:#fff}.main{border:0;border-radius:17px;padding:14px 25px;margin:5px;background:linear-gradient(135deg,#2563eb,#7c3aed);font-weight:900;box-shadow:0 10px 28px #2563eb55}.secondary{background:#172554;border:1px solid #ffffff22}.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px}.card{min-width:120px;padding:10px 16px;border:1px solid #ffffff15;border-radius:16px;background:#ffffff08}.card b{display:block;font-size:21px}
#hud{position:fixed;z-index:10;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;gap:12px;padding:8px 15px;border:1px solid #ffffff25;border-radius:18px;background:#030712cc;backdrop-filter:blur(12px);font-weight:900;white-space:nowrap;font-size:14px}
.c{color:#67e8f9}.g{color:#4ade80}.r{color:#fb7185}
#pauseBtn{position:fixed;z-index:12;right:15px;top:70px;display:none;width:48px;height:48px;border-radius:15px;border:1px solid #ffffff25;background:#09112ddd;font-size:20px}
#controls{position:fixed;z-index:12;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:end;padding:0 max(18px,env(safe-area-inset-left));direction:ltr;pointer-events:none}
.grp{display:flex;gap:12px;pointer-events:auto}.ctl{width:82px;height:82px;border-radius:24px;border:1px solid #ffffff35;background:linear-gradient(145deg,#38548e,#0b1530);box-shadow:0 12px 24px #000b,inset 0 1px #fff4;font-size:34px;font-weight:1000}.ctl:active,.pressed{transform:scale(.92);filter:brightness(1.3)}.dash{font-size:13px;color:#67e8f9}.round{width:88px;height:88px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.tile{padding:15px 8px;border-radius:18px;border:1px solid #ffffff18;background:#101b38}.tile.lock{opacity:.4}.tile b{font-size:23px}.tile small{display:block;color:#94a3b8;margin-top:5px}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.hero{padding:15px;border-radius:20px;background:#ffffff08;border:1px solid #ffffff15}.avatar{width:86px;height:86px;border-radius:50%;margin:auto;display:grid;place-items:center;font-size:48px;background:radial-gradient(circle,#67e8f9,#312e81);box-shadow:0 0 35px #67e8f955}.price{color:#fbbf24;font-weight:900}
#rotate{display:none;position:fixed;z-index:99;inset:0;background:#020617;align-items:center;justify-content:center;text-align:center}@media(orientation:portrait) and (max-width:700px){#rotate{display:flex}}@media(max-height:500px){.ctl{width:74px;height:74px}.round{width:78px;height:78px}#hud{font-size:11px;gap:7px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud">🏆 <span id="score" class="c">0</span> · 🪙 <span id="gold" class="c">0</span> · 💎 <span id="diamond" class="c">0</span> · ❤️ <span id="lives" class="c">3</span> · ⚡ <span id="dash" class="g">جاهز</span></div>
<button id="pauseBtn">Ⅱ</button>
<div id="controls"><div class="grp"><button class="ctl" id="left">◀</button><button class="ctl" id="right">▶</button></div><div class="grp"><button class="ctl round" id="jump">⬆</button><button class="ctl round dash" id="dashBtn">DASH</button></div></div>
<div class="screen" id="home"><div class="panel"><div class="logo">EPIX JUMP</div><p>ULTRA V3 — مغامرة حارقة 💥</p><div class="cards"><div class="card">🏆 الأفضل<b id="best">0</b></div><div class="card">🪙 الذهب<b id="goldBank">0</b></div><div class="card">💎 الألماس<b id="diamondBank">0</b></div><div class="card">🔓 المراحل<b id="openCount">1</b></div></div><button type="button" class="main" id="levelsBtn">🗺️ المراحل</button><button type="button" class="main" id="shopBtn">🛒 متجر الشخصيات</button></div></div>
<div class="screen" id="levels" style="display:none"><div class="panel"><h2>🗺️ عالم المغامرة</h2><div class="grid" id="levelGrid"></div><button type="button" class="main secondary" id="home1">رجوع</button></div></div>
<div class="screen" id="shop" style="display:none"><div class="panel"><h2>🛒 متجر الشخصيات</h2><p>اشترِ شخصيات جديدة بالذهب أو الألماس.</p><div class="shop" id="shopGrid"></div><button type="button" class="main secondary" id="home2">رجوع</button></div></div>
<div class="screen" id="pause" style="display:none"><div class="panel"><h2>⏸️ متوقف</h2><button class="main" id="resume">▶ متابعة</button><button class="main secondary" id="restart">↻ إعادة المرحلة</button><button class="main secondary" id="levels2">🗺️ المراحل</button></div></div>
<div class="screen" id="win" style="display:none"><div class="panel"><div class="logo" style="font-size:48px">🔥 فوز!</div><p id="winText"></p><button class="main" id="next">⚡ التالية</button><button class="main secondary" id="levels3">🗺️ المراحل</button></div></div>
<div class="screen" id="over" style="display:none"><div class="panel"><h2>💥 انتهت الأرواح</h2><button class="main" id="retry">↻ حاول مرة أخرى</button><button class="main secondary" id="levels4">🗺️ المراحل</button></div></div>
<div id="rotate"><div><div style="font-size:70px">📱↔️</div><h2>أدر الهاتف للوضع الأفقي</h2><p>اللعبة تعمل بكامل الشاشة بالعرض.</p></div></div>
<script>
const cv=document.getElementById("game"),ctx=cv.getContext("2d"),$=i=>document.getElementById(i),keys={};
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resizeCanvas(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resizeCanvas);
addEventListener("orientationchange",()=>setTimeout(resizeCanvas,100));
resizeCanvas();
let mode="home",level=1,score=0,gold=0,diamond=0,lives=3,cam=0,t=0,shake=0,checkpoint=100;
let best=+localStorage.epixBest||0,gbank=+localStorage.epixGold||500,dbank=+localStorage.epixDiamond||30,open=+localStorage.epixOpen||1;
let owned=JSON.parse(localStorage.epixOwned||'["nova"]'),hero=localStorage.epixHero||"nova";
const heroes={nova:{name:"Nova",icon:"🦸",cost:0,type:"gold"},shadow:{name:"Shadow",icon:"🥷",cost:120,type:"diamond"},robot:{name:"Titan",icon:"🤖",cost:500,type:"gold"},fire:{name:"Inferno",icon:"🔥",cost:250,type:"diamond"},cyber:{name:"Cyber",icon:"🤩",cost:900,type:"gold"},ice:{name:"Frost",icon:"🧊",cost:400,type:"diamond"}};
const levels=[
["🌌","حدائق النيون",4800],["🌊","جزر السماء",5200],["⚡","مدينة البرق",5600],["🌋","جبل الحمم",6000],["🏰","قلعة الظلال",6500],["🌲","الغابة المفقودة",7000],["🏜️","صحراء العمالقة",7500],["🚀","المجرة الأخيرة",8200]];
let platforms=[],coins=[],gems=[],enemies=[],particles=[];
const p={x:100,y:500,w:44,h:64,vx:0,vy:0,ground:false,dir:1,cd:0,dash:false,dt:0,inv:0};
function build(n){let L=levels[n-1][2];platforms=[
{x:0,y:Math.min(700,H-170),w:950,h:380},{x:1050,y:Math.min(700,H-170),w:750,h:380},{x:1900,y:Math.min(620,H-250),w:650,h:460}];
/* NEW: continuous stepping stones over every gap, always reachable */
for(let q=650;q<L-500;q+=430) platforms.push({x:q,y:Math.max(350,H-520)-(Math.floor(q/430)%3)*55,w:300,h:30});
platforms.push({x:L-650,y:Math.max(430,H-480),w:650,h:510});
coins=[];gems=[];enemies=[];
for(let q=280;q<L-180;q+=240)coins.push({x:q,y:400-(q%4)*20,r:15,got:false});
for(let q=900;q<L-300;q+=650)gems.push({x:q,y:300+(q%2)*100,r:21,got:false});
let ty=["walker","jumper","flyer","charger"];for(let q=900;q<L-450;q+=600)enemies.push({type:ty[Math.floor(q/600)%4],x:q,y:620,w:55,h:78,vx:q%2?2.2:-2.2,min:q-120,max:q+180,vy:0,base:350+(q%2)*90,ph:q})}
function reset(){score=0;gold=0;diamond=0;lives=3;checkpoint=100;build(level);p.x=120;p.y=Math.max(250,H-520);p.vx=p.vy=0;p.cd=0;p.dash=false;p.inv=100}
function hide(){["home","levels","shop","pause","win","over"].forEach(i=>$(i).style.display="none")}
function start(n){level=n;reset();mode="play";hide();$("hud").style.display="flex";$("controls").style.display="flex";$("pauseBtn").style.display="block";sound()}
function render(){let g=$("levelGrid");g.innerHTML="";for(let i=1;i<=levels.length;i++){let b=document.createElement("button");b.className="tile "+(i>open?"lock":"");b.innerHTML=`<b>${levels[i-1][0]} ${i}</b><small>${i<=open?levels[i-1][1]:"🔒 مغلقة"}</small>`;if(i<=open)b.onclick=()=>start(i);g.appendChild(b)}$("best").textContent=best;$("goldBank").textContent=gbank;$("diamondBank").textContent=dbank;$("openCount").textContent=open}
function shop(){let g=$("shopGrid");g.innerHTML="";for(let k in heroes){let h=heroes[k],have=owned.includes(k);let b=document.createElement("div");b.className="hero";b.innerHTML=`<div class="avatar">${h.icon}</div><h3>${h.name}</h3><div class="price">${have?"✅ مملوكة":(h.type=="gold"?"🪙 "+h.cost:"💎 "+h.cost)}</div><button class="main" data-k="${k}">${have?(hero==k?"⭐ مختارة":"اختيار"):"شراء"}</button>`;g.appendChild(b)}
g.querySelectorAll("button").forEach(b=>b.onclick=()=>{let k=b.dataset.k,h=heroes[k];if(owned.includes(k)){hero=k;localStorage.epixHero=k;shop()}else if(h.type=="gold"&&gbank>=h.cost){gbank-=h.cost;owned.push(k);localStorage.epixGold=gbank;localStorage.epixOwned=JSON.stringify(owned);hero=k;localStorage.epixHero=k;shop()}else if(h.type=="diamond"&&dbank>=h.cost){dbank-=h.cost;owned.push(k);localStorage.epixDiamond=dbank;localStorage.epixOwned=JSON.stringify(owned);hero=k;localStorage.epixHero=k;shop()}else alert("الرصيد غير كافٍ!")})}
function finish(){best=Math.max(best,score);gbank+=gold;dbank+=diamond;open=Math.min(8,Math.max(open,level+1));localStorage.epixBest=best;localStorage.epixGold=gbank;localStorage.epixDiamond=dbank;localStorage.epixOpen=open;mode="win";$("hud").style.display=$("controls").style.display=$("pauseBtn").style.display="none";$("winText").innerHTML=`${levels[level-1][1]}<br>🏆 ${score} · 🪙 ${gold} · 💎 ${diamond}`;$("next").textContent=level<8?"⚡ فتح المرحلة التالية":"🏆 العودة للمراحل";$("next").onclick=()=>level<8?start(level+1):showLevels();$("win").style.display="flex";sfx("win")}
function gameover(){best=Math.max(best,score);localStorage.epixBest=best;mode="over";$("hud").style.display=$("controls").style.display=$("pauseBtn").style.display="none";$("over").style.display="flex"}
let AC,musicTimer;function sound(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();if(!musicTimer)music()}
function tone(f,d=.1,type="sine",v=.05,delay=0){if(!AC)return;let o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function sfx(q){sound();if(q=="jump"){tone(240,.08);tone(480,.13,"sine",.04,.06)}if(q=="coin"){tone(660,.07,"triangle",.07);tone(990,.13,"triangle",.05,.07)}if(q=="gem"){tone(440,.08,"triangle",.08);tone(880,.12,"triangle",.06,.08);tone(1320,.17,"triangle",.04,.17)}if(q=="dash"){tone(320,.16,"sawtooth",.07);tone(80,.22,"sawtooth",.04,.06)}if(q=="hit")tone(70,.25,"square",.09);if(q=="win")[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.06,i*.12))}
function music(){if(musicTimer)return;let beat=()=>{if(mode=="play"){tone(196,.11,"triangle",.012);tone(247,.11,"triangle",.01,.15);tone(294,.11,"triangle",.01,.3);tone(392,.15,"triangle",.01,.45)}musicTimer=setTimeout(()=>{musicTimer=null;music()},850)};beat()}
function burst(a,b,col,n=20){for(let i=0;i<n;i++)particles.push({x:a,y:b,vx:(Math.random()-.5)*13,vy:(Math.random()-.5)*13,r:2+Math.random()*6,l:25+Math.random()*35,col})}
function jump(){if(mode=="play"&&p.ground&&!p.dash){p.vy=-16;p.ground=false;sfx("jump");burst(p.x+30,p.y+p.h,"#e0f2fe",12)}}
function dash(){if(mode=="play"&&p.cd<=0&&!p.dash){p.dash=true;p.dt=16;p.cd=80;p.dir=(keys.ArrowLeft||keys.KeyA)?-1:(keys.ArrowRight||keys.KeyD)?1:p.dir;sfx("dash");shake=13}}
function respawn(){p.x=checkpoint;p.y=Math.max(250,H-520);p.vx=p.vy=0;p.inv=100}
function foe(e){if(p.inv>0)return;if(p.dash){enemies=enemies.filter(a=>a!==e);score+=160;burst(e.x,e.y,"#67e8f9",30);return}if(p.vy>0&&p.y+p.h-p.vy<=e.y+18){enemies=enemies.filter(a=>a!==e);p.vy=-12;score+=90;burst(e.x,e.y,"#fb7185",25);sfx("coin");return}lives--;sfx("hit");shake=20;lives<=0?gameover():respawn()}
function update(){if(mode!="play")return;t++;if(p.cd)p.cd--;if(p.inv)p.inv--;
if(p.dash){p.vx=p.dir*20;p.vy=0;if(--p.dt<=0)p.dash=false}else{if(keys.ArrowRight||keys.KeyD){p.vx=7;p.dir=1}else if(keys.ArrowLeft||keys.KeyA){p.vx=-7;p.dir=-1}else p.vx*=.8;p.vy+=.62}
let old=p.y;p.x+=p.vx;p.y+=p.vy;p.ground=false;
platforms.forEach(a=>{if(p.x+p.w>a.x&&p.x<a.x+a.w&&old+p.h<=a.y&&p.y+p.h>=a.y&&p.vy>=0){p.y=a.y-p.h;p.vy=0;p.ground=true}});
enemies.forEach(e=>{if(e.type=="flyer"){e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;e.y=e.base+Math.sin(t*.055+e.ph)*65}else{e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(e.type=="jumper"){e.vy+=.55;e.y+=e.vy;if(e.y>620){e.y=620;e.vy=-12}}if(e.type=="charger"&&Math.abs(p.x-e.x)<450)e.vx+=(p.x>e.x?.06:-.06)}});
enemies.slice().forEach(e=>{if(p.x+p.w>e.x&&p.x<e.x+e.w&&p.y+p.h>e.y&&p.y<e.y+e.h)foe(e)});
coins.forEach(a=>{if(!a.got&&p.x+p.w>a.x-a.r&&p.x<a.x+a.r&&p.y+p.h>a.y-a.r&&p.y<a.y+a.r){a.got=true;gold++;score+=30;sfx("coin");burst(a.x,a.y,"#facc15",18)}});
gems.forEach(a=>{if(!a.got&&p.x+p.w>a.x-a.r&&p.x<a.x+a.r&&p.y+p.h>a.y-a.r&&p.y<a.y+a.r){a.got=true;diamond++;score+=150;sfx("gem");burst(a.x,a.y,"#c084fc",30)}});
if(p.x>1400)checkpoint=Math.max(checkpoint,1400);if(p.x>3200)checkpoint=Math.max(checkpoint,3200);if(p.x>5000)checkpoint=Math.max(checkpoint,5000);
if(p.x>levels[level-1][2]-150){score+=1200;finish()}if(p.y>H+100){lives--;sfx("hit");lives<=0?gameover():respawn()}
cam=Math.max(0,Math.min(Math.max(0,levels[level-1][2]-W),p.x-W*0.28));particles.forEach((a,i)=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.18;a.l--;if(a.l<=0)particles.splice(i,1)});
$("score").textContent=score;$("gold").textContent=gold;$("diamond").textContent=diamond;$("lives").textContent=lives;$("dash").textContent=p.cd?"∞ "+Math.ceil(p.cd/10):"جاهز";$("dash").className=p.cd?"r":"g"}
function round(a,b,w,h,r){ctx.beginPath();ctx.roundRect(a,b,w,h,r);ctx.fill()}
function drawHero(){let a=p.x,b=p.y,h=heroes[hero];ctx.save();if(p.inv%6<3)ctx.globalAlpha=.45;if(p.dash){for(let i=1;i<8;i++){ctx.globalAlpha=.07;ctx.fillStyle="#67e8f9";round(a-p.dir*i*32,b+10,55,65,18)}ctx.globalAlpha=1}
ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(a+29,b+84,34,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111827";round(a+8,b+53,15,29,6);round(a+34,b+53,15,29,6);
let g=ctx.createLinearGradient(a,b,a+58,b+82);g.addColorStop(0,"#67e8f9");g.addColorStop(1,"#4f46e5");ctx.fillStyle=g;round(a+4,b+27,50,35,14);
ctx.fillStyle="#ffd7b5";ctx.beginPath();ctx.arc(a+29,b+17,20,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(a+29,b+14,20,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle="#0f172a";round(a+8,b+14,42,13,6);ctx.fillStyle="#67e8f9";ctx.fillRect(a+14,b+18,28,4);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(a+29,b+39,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="#4f46e5";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText(h.icon,a+29,b+43);ctx.restore()}
function draw(){let s=levels[level-1],gr=ctx.createLinearGradient(0,0,0,H);let themes=[["#06133d","#312e81"],["#042f3b","#0f766e"],["#071a2b","#1d4ed8"],["#2b0808","#991b1b"],["#13071e","#581c87"],["#062e1b","#166534"],["#3b2105","#92400e"],["#020617","#172554"]],th=themes[level-1];gr.addColorStop(0,th[0]);gr.addColorStop(1,th[1]);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
for(let i=0;i<120;i++){let sx=((i*173-cam*.1)%(W+100)+W+100)%(W+100),sy=(i*67)%(Math.max(260,H*.72));ctx.fillStyle=i%8?"#ffffff44":"#fff";ctx.fillRect(sx,sy,2,2)}
ctx.save();if(shake){ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);shake--}ctx.translate(-cam,0);
platforms.forEach(a=>{let q=ctx.createLinearGradient(0,a.y,0,a.y+a.h);q.addColorStop(0,"#718096");q.addColorStop(1,"#111827");ctx.fillStyle=q;round(a.x,a.y,a.w,a.h,a.h>100?16:9);ctx.fillStyle="#a5b4fc";ctx.fillRect(a.x,a.y,a.w,5)});
coins.forEach(a=>{if(!a.got){ctx.fillStyle="#facc15";ctx.beginPath();ctx.ellipse(a.x,a.y,11,17,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff4a3";ctx.stroke()}});
gems.forEach(a=>{if(!a.got){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(t*.03);ctx.fillStyle="#c084fc";ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(18,-7);ctx.lineTo(11,18);ctx.lineTo(0,23);ctx.lineTo(-11,18);ctx.lineTo(-18,-7);ctx.closePath();ctx.fill();ctx.strokeStyle="#f5d0fe";ctx.stroke();ctx.restore()}});
enemies.forEach(e=>{ctx.fillStyle=e.type=="flyer"?"#d946ef":e.type=="jumper"?"#f97316":e.type=="charger"?"#dc2626":"#b91c1c";round(e.x,e.y,e.w,e.h,14);ctx.fillStyle="#fff";ctx.fillRect(e.x+10,e.y+17,9,9);ctx.fillRect(e.x+36,e.y+17,9,9);ctx.fillStyle="#111827";ctx.fillRect(e.x+15,e.y+46,25,5)});

ctx.fillStyle="#fbbf24";ctx.shadowBlur=35;ctx.shadowColor="#fbbf24";ctx.fillRect(levels[level-1][2]-100,390,10,310);ctx.beginPath();ctx.arc(levels[level-1][2]-95,375,32+Math.sin(t*.1)*5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore()}

function hold(id,k){let b=$(id),on=e=>{e.preventDefault();keys[k]=1;b.classList.add("pressed")},off=e=>{e.preventDefault();keys[k]=0;b.classList.remove("pressed")};["touchstart","mousedown"].forEach(v=>b.addEventListener(v,on,{passive:false}));["touchend","touchcancel","mouseup","mouseleave"].forEach(v=>b.addEventListener(v,off,{passive:false}))}
function act(id,f){let b=$(id),z=e=>{e.preventDefault();b.classList.add("pressed");f();setTimeout(()=>b.classList.remove("pressed"),120)};["touchstart","mousedown"].forEach(v=>b.addEventListener(v,z,{passive:false}))}
