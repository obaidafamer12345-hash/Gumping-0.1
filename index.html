<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Epix Jump — الإصدار 0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#050816;color:#fff;font-family:"Segoe UI",Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;background:#050816}canvas{width:100vw;height:100vh;object-fit:contain;display:block}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:none;gap:14px;align-items:center;padding:8px 13px;border:1px solid #ffffff25;border-radius:15px;background:#080c20cc;backdrop-filter:blur(12px);font-size:13px;font-weight:800;white-space:nowrap}
#hud .v{color:#67e8f9}.ok{color:#4ade80}.bad{color:#fb7185}
#menu,#pause,#gameover{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#050816dd,#0b1238ee)}
.panel{width:min(92vw,520px);padding:28px;border:1px solid #ffffff20;border-radius:26px;background:#0c1430ee;box-shadow:0 25px 80px #000b;backdrop-filter:blur(14px)}
.logo{font-size:48px;font-weight:1000;letter-spacing:1px;background:linear-gradient(90deg,#67e8f9,#818cf8,#c084fc);-webkit-background-clip:text;color:transparent}
.subtitle{color:#cbd5e1;margin:8px 0 22px}.stats{display:flex;justify-content:center;gap:20px;color:#94a3b8;margin:15px 0 22px}.stats b{color:#fff}
button{font:inherit;cursor:pointer}
.mainBtn{border:0;border-radius:15px;padding:13px 26px;margin:5px;background:#2563eb;color:white;font-weight:900;box-shadow:0 8px 25px #2563eb55}
.altBtn{background:#172554;border:1px solid #ffffff22}.small{font-size:12px;color:#94a3b8;margin-top:14px}
#pause,#gameover{display:none}
#controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;display:none;justify-content:space-between;align-items:flex-end;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right));direction:ltr;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}.ctrl{width:68px;height:68px;border-radius:20px;border:1px solid #ffffff30;background:linear-gradient(145deg,#263a6a,#101a38);color:#fff;box-shadow:0 8px 20px #0009,inset 0 1px #ffffff25;font-size:28px;font-weight:900;padding:0}
.ctrl:active,.pressed{transform:scale(.93);background:#31518c}.round{width:76px;height:76px;border-radius:50%}.dash{font-size:12px;color:#67e8f9}
#pauseBtn{position:fixed;right:16px;top:75px;z-index:25;display:none;width:42px;height:42px;border-radius:13px;border:1px solid #ffffff22;background:#0c1430cc;color:#fff;font-weight:900}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#050816;align-items:center;justify-content:center;text-align:center;padding:25px}.rotateBox{max-width:420px}.rotateBox div{font-size:60px}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
@media(max-height:500px){#hud{font-size:10px;padding:5px 9px;gap:8px}.ctrl{width:58px;height:58px}.round{width:65px;height:65px}}
</style>
</head>
<body>
<div id="game"><canvas id="c" width="1280" height="720"></canvas></div>

<div id="hud">
<span>🏆 <span id="score" class="v">0</span></span>
<span>💎 <span id="gems" class="v">0</span></span>
<span>🪙 <span id="coins" class="v">0</span></span>
<span>❤️ <span id="lives" class="v">3</span></span>
<span>📍 <span id="checkpoint" class="v">1</span></span>
<span>⚡ <span id="dash" class="ok">جاهز</span></span>
</div>

<button id="pauseBtn">Ⅱ</button>

<div id="controls">
 <div class="group"><button class="ctrl" id="back">◀</button><button class="ctrl" id="forward">▶</button></div>
 <div class="group"><button class="ctrl round" id="jump">⬆</button><button class="ctrl round dash" id="dashBtn">DASH</button></div>
</div>

<div id="menu"><div class="panel">
 <div class="logo">EPIX JUMP</div>
 <div class="subtitle">مغامرة المنصات الخارقة</div>
 <div class="stats">أفضل نتيجة: <b id="bestMenu">0</b> · الجواهر: <b id="gemMenu">0</b></div>
 <button class="mainBtn" id="start">▶ ابدأ المغامرة</button>
 <button class="mainBtn altBtn" id="resetBest">مسح أفضل نتيجة</button>
 <div class="small">اللعبة تعمل بالعرض · الأسهم أو أزرار اللمس · Space للقفز · Shift للـDash</div>
</div></div>

<div id="pause"><div class="panel">
 <div class="logo" style="font-size:38px">⏸ إيقاف مؤقت</div>
 <button class="mainBtn" id="resume">▶ متابعة</button>
 <button class="mainBtn altBtn" id="restart">↻ إعادة المرحلة</button>
 <button class="mainBtn altBtn" id="menuBtn">⌂ القائمة الرئيسية</button>
</div></div>

<div id="gameover"><div class="panel">
 <div class="logo" style="font-size:38px">🏁 انتهت المغامرة</div>
 <div class="stats"><span>النقاط <b id="finalScore">0</b></span><span>أفضل <b id="finalBest">0</b></span></div>
 <button class="mainBtn" id="again">↻ العب من جديد</button>
 <button class="mainBtn altBtn" id="home">⌂ القائمة</button>
</div></div>

<div id="rotate"><div class="rotateBox"><div>📱↔️</div><h2>أدر الهاتف للوضع الأفقي</h2><p>تم تصميم Epix Jump للعب بالعرض للحصول على تحكم ومساحة أفضل.</p></div></div>

<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),W=1280,H=720;
const $=id=>document.getElementById(id);
let state="menu",score=0,coinsGot=0,gemsGot=0,lives=3,checkpoint=1,cameraX=0,time=0,shake=0,level=1;
let best=Number(localStorage.getItem("epixBest")||0),savedGems=Number(localStorage.getItem("epixGems")||0);
$("bestMenu").textContent=best;$("gemMenu").textContent=savedGems;

const keys={};
const AC=window.AudioContext||window.webkitAudioContext;let audio=null,musicTimer=null;
function audioStart(){if(!AC)return;if(!audio)audio=new AC();if(audio.state==="suspended")audio.resume();if(!musicTimer)musicLoop()}
function tone(freq,dur=.12,type="sine",vol=.06,delay=0){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,n);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+dur)}
function sfx(t){audioStart();if(t==="jump"){tone(220,.08,"sine",.08);tone(440,.13,"sine",.05,.06)}if(t==="coin"){tone(650,.07,"triangle",.08);tone(980,.11,"triangle",.05,.07)}if(t==="gem"){tone(500,.08,"triangle",.09);tone(900,.16,"triangle",.07,.08);tone(1300,.18,"sine",.04,.16)}if(t==="dash"){tone(280,.18,"sawtooth",.07);tone(100,.22,"sawtooth",.04,.06)}if(t==="hit"){tone(100,.22,"square",.1);tone(55,.28,"square",.05,.08)}if(t==="checkpoint"){tone(500,.1,"sine",.08);tone(750,.12,"sine",.07,.1);tone(1100,.18,"sine",.05,.2)}}
function musicLoop(){if(state==="play"){tone(196,.18,"triangle",.018);tone(247,.18,"triangle",.014,.22);tone(294,.18,"triangle",.014,.44);tone(247,.18,"triangle",.014,.66)}musicTimer=setTimeout(()=>{musicTimer=null;if(state!=="menu")musicLoop()},1400)}

const player={x:100,y:500,w:44,h:64,vx:0,vy:0,speed:6,jump:-14,gravity:.58,grounded:false,dashCD:0,dashing:false,dashT:0,dashDir:1,inv:0};
const sections=[
 {start:0,end:1550,theme:0,plats:[{x:0,y:590,w:1550,h:130},{x:430,y:445,w:230,h:25},{x:790,y:335,w:250,h:25},{x:1120,y:445,w:200,h:25},{x:1450,y:370,w:270,h:25}]},
 {start:1550,end:2900,theme:1,plats:[{x:1550,y:520,w:180,h:30},{x:1900,y:590,w:1000,h:130},{x:1780,y:410,w:190,h:25},{x:2150,y:430,w:230,h:25},{x:2500,y:310,w:230,h:25},{x:2780,y:430,w:190,h:25}]},
 {start:2900,end:4300,theme:2,plats:[{x:2900,y:590,w:1500,h:130},{x:3050,y:380,w:210,h:25},{x:3400,y:280,w:240,h:25},{x:3750,y:410,w:230,h:25},{x:4050,y:300,w:250,h:25}]}
];
let platforms=sections.flatMap(s=>s.plats);
let coins=[],gems=[],enemies=[];
function makeLevel(){
 coins=[];gems=[];enemies=[];
 const coinXs=[480,560,840,930,1160,1280,1510,1840,1950,2220,2340,2570,2700,3070,3180,3430,3540,3790,3910,4100,4210];
 coinXs.forEach((x,i)=>coins.push({x,y:sections[Math.floor(i/7)].theme===0?[390,350,280,280,380,330,310][i%7]:[350,500,360,250,250,340,220][i%7],r:13,taken:false}));
 [900,1370,2020,2650,3500,4160].forEach((x,i)=>gems.push({x,y:[270,315,470,250,220,245][i],r:17,taken:false}));
 enemies=[
  {type:"walker",x:540,y:381,w:44,h:64,vx:2,min:450,max:620},
  {type:"walker",x:1180,y:381,w:44,h:64,vx:-2,min:1120,max:1290},
  {type:"jumper",x:1810,y:526,w:44,h:64,vx:1.5,min:1770,max:1940,vy:0},
  {type:"flyer",x:2280,y:350,w:48,h:38,vx:2,min:2160,max:2390,baseY:350,phase:0},
  {type:"walker",x:2630,y:246,w:44,h:64,vx:2,min:2500,max:2700},
  {type:"flyer",x:3400,y:220,w:48,h:38,vx:2.4,min:3350,max:3600,baseY:220,phase:1},
  {type:"jumper",x:3820,y:346,w:44,h:64,vx:-2,min:3760,max:3950,vy:0}
 ];
}
makeLevel();

const particles=[];
function burst(x,y,c,n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,r:2+Math.random()*5,life:25+Math.random()*25,c})}
function saveProgress(){localStorage.setItem("epixBest",String(Math.max(best,score)));localStorage.setItem("epixGems",String(savedGems+gemsGot))}
function checkpointSave(){checkpoint=Math.min(3,Math.floor(player.x/1400)+1);sfx("checkpoint")}
function respawn(){player.x=checkpoint===1?100:checkpoint===2?1950:3000;player.y=450;player.vx=0;player.vy=0;player.dashing=false;player.inv=70}
function gameStart(){audioStart();score=0;coinsGot=0;gemsGot=0;lives=3;checkpoint=1;level=1;makeLevel();respawn();state="play";$("menu").style.display="none";$("gameover").style.display="none";$("pause").style.display="none";$("hud").style.display="flex";$("controls").style.display="flex";$("pauseBtn").style.display="block"}
function gameEnd(){best=Math.max(best,score);saveProgress();$("finalScore").textContent=score;$("finalBest").textContent=best;$("gameover").style.display="flex";$("hud").style.display="none";$("controls").style.display="none";$("pauseBtn").style.display="none";state="over"}
function pause(){if(state==="play"){state="pause";$("pause").style.display="flex"}else if(state==="pause"){state="play";$("pause").style.display="none";audioStart()}}
function restart(){score=Math.max(0,score-50);lives=3;makeLevel();respawn();state="play";$("pause").style.display="none";$("hud").style.display="flex";$("controls").style.display="flex"}
function home(){saveProgress();state="menu";$("pause").style.display="none";$("gameover").style.display="none";$("hud").style.display="none";$("controls").style.display="none";$("pauseBtn").style.display="none";$("menu").style.display="flex";$("bestMenu").textContent=best;$("gemMenu").textContent=savedGems+gemsGot}

function jump(){if(state==="play"&&player.grounded&&!player.dashing){player.vy=player.jump;player.grounded=false;sfx("jump");burst(player.x+22,player.y+62,"#bff6ff",10)}}
function dash(){if(state==="play"&&player.dashCD<=0&&!player.dashing){player.dashing=true;player.dashT=14;player.dashCD=70;player.dashDir=(keys.ArrowLeft||keys.KeyA)?-1:((keys.ArrowRight||keys.KeyD)?1:player.dashDir);sfx("dash");shake=10}}

window.addEventListener("keydown",e=>{keys[e.code]=true;if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")jump();if(e.code==="ShiftLeft"||e.code==="ShiftRight")dash();if(e.code==="Escape"||e.code==="KeyP")pause()});
window.addEventListener("keyup",e=>keys[e.code]=false);
function hold(id,key){const b=$(id),dn=e=>{e.preventDefault();b.classList.add("pressed");keys[key]=true},up=e=>{e.preventDefault();b.classList.remove("pressed");keys[key]=false};["touchstart","mousedown"].forEach(v=>b.addEventListener(v,dn,{passive:false}));["touchend","touchcancel","mouseup","mouseleave"].forEach(v=>b.addEventListener(v,up,{passive:false}))}
function action(id,fn){const b=$(id),f=e=>{e.preventDefault();b.classList.add("pressed");fn();setTimeout(()=>b.classList.remove("pressed"),100)};["touchstart","mousedown"].forEach(v=>b.addEventListener(v,f,{passive:false}))}
hold("back","ArrowLeft");hold("forward","ArrowRight");action("jump",jump);action("dashBtn",dash);
$("pauseBtn").onclick=pause;$("start").onclick=gameStart;$("resume").onclick=pause;$("restart").onclick=restart;$("menuBtn").onclick=home;$("again").onclick=gameStart;$("home").onclick=home;
$("resetBest").onclick=()=>{localStorage.removeItem("epixBest");localStorage.removeItem("epixGems");best=0;savedGems=0;$("bestMenu").textContent=0;$("gemMenu").textContent=0};

function update(){
 if(state!=="play")return;time++;
 if(player.dashCD>0)player.dashCD--;if(player.inv>0)player.inv--;
 const difficulty=1+Math.min(1.8,player.x/1800);
 if(player.dashing){player.vx=player.dashDir*(17+difficulty);player.vy=0;player.dashT--;if(player.dashT<=0)player.dashing=false}
 else{if(keys.ArrowRight||keys.KeyD){player.vx=player.speed;player.dashDir=1}else if(keys.ArrowLeft||keys.KeyA){player.vx=-player.speed;player.dashDir=-1}else player.vx*=.74;player.vy+=player.gravity}
 const oldY=player.y;player.x+=player.vx;player.y+=player.vy;player.grounded=false;
 platforms.forEach(p=>{if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.grounded=true}});
 enemies.forEach(e=>{
  if(e.type==="flyer"){e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;e.phase+=.06;e.y=e.baseY+Math.sin(e.phase)*35}
  else{e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(e.type==="jumper"){e.vy+=.5;e.y+=e.vy;if(e.y>=526){e.y=526;e.vy=-11}}}
 });
 enemies.slice().forEach(e=>{
  const hit=player.x+player.w>e.x&&player.x<e.x+e.w&&player.y+player.h>e.y&&player.y<e.y+e.h&&player.inv<=0;
  if(!hit)return;
  if(player.dashing){enemies=enemies.filter(a=>a!==e);score+=120;burst(e.x+20,e.y+25,"#67e8f9",24);sfx("coin")}
  else if(player.vy>0&&oldY+player.h<=e.y+15){enemies=enemies.filter(a=>a!==e);player.vy=-11;score+=70;burst(e.x+20,e.y+20,"#fb7185",20);sfx("coin")}
  else{lives--;sfx("hit");shake=16;respawn();if(lives<=0)gameEnd()}
 });
 coins.forEach(c=>{if(!c.taken&&player.x+player.w>c.x-c.r&&player.x<c.x+c.r&&player.y+player.h>c.y-c.r&&player.y<c.y+c.r){c.taken=true;coinsGot++;score+=25;sfx("coin");burst(c.x,c.y,"#facc15",16)}});
 gems.forEach(g=>{if(!g.taken&&player.x+player.w>g.x-g.r&&player.x<g.x+g.r&&player.y+player.h>g.y-g.r&&player.y<g.y+g.r){g.taken=true;gemsGot++;score+=100;sfx("gem");burst(g.x,g.y,"#a78bfa",25)}});
 if(player.x>1400&&checkpoint===1)checkpointSave();
 if(player.x>2850&&checkpoint===2)checkpointSave();
 if(player.x>4250){score+=500;burst(player.x,player.y,"#fbbf24",35);gameEnd()}
 if(player.y>H+150){lives--;sfx("hit");shake=16;if(lives<=0)gameEnd();else respawn()}
 cameraX=Math.max(0,Math.min(3150,player.x-420));
 particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.life--;if(p.life<=0)particles.splice(i,1)});
 level=Math.min(3,1+Math.floor(player.x/1450));
 $("score").textContent=score;$("coins").textContent=coinsGot;$("gems").textContent=gemsGot;$("lives").textContent=lives;$("checkpoint").textContent=checkpoint;
 $("dash").textContent=player.dashCD<=0?"جاهز":Math.ceil(player.dashCD/10);$("dash").className=player.dashCD<=0?"ok":"bad";
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function playerDraw(){
 const x=player.x,y=player.y;ctx.save();if(player.inv%6<3)ctx.globalAlpha=.5;
 ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(x+22,y+67,27,6,0,0,Math.PI*2);ctx.fill();
 if(player.dashing){for(let i=1;i<6;i++){ctx.globalAlpha=.11;ctx.fillStyle="#67e8f9";rr(x-player.dashDir*i*25,y+7,42,53,13)}ctx.globalAlpha=1}
 ctx.fillStyle="#172554";rr(x+6,y+44,13,20,5);rr(x+25,y+44,13,20,5);
 const g=ctx.createLinearGradient(x,y,x+44,y+64);g.addColorStop(0,"#67e8f9");g.addColorStop(1,"#2563eb");ctx.fillStyle=g;rr(x+4,y+22,36,30,11);
 ctx.fillStyle="#ffd7b5";ctx.beginPath();ctx.arc(x+22,y+15,15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#0f172a";ctx.beginPath();ctx.arc(x+22,y+13,15,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(x+7,y+10,30,8);
 ctx.fillStyle="#111827";rr(x+10,y+12,24,9,4);ctx.fillStyle="#67e8f9";ctx.fillRect(x+13,y+14,18,3);
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+22,y+30,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#2563eb";ctx.font="bold 9px Arial";ctx.textAlign="center";ctx.fillText("E",x+22,y+33);ctx.restore()
}
function draw(){
 ctx.save();if(shake){ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);shake--}
 const theme=level===1?["#070b2b","#312e81"]:level===2?["#071b2a","#0f766e"]:["#17091f","#581c87"];
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,theme[0]);sky.addColorStop(1,theme[1]);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<55;i++){const sx=((i*151-cameraX*.12)%(W+120)+W+120)%(W+120)-60,sy=(i*79)%390;ctx.fillStyle=i%5===0?"#fff":"#ffffff80";ctx.fillRect(sx,sy,2,2)}
 for(let i=0;i<20;i++){const bx=((i*200-cameraX*.2)%(W+240)+W+240)%(W+240)-100,bh=70+(i*43)%190;ctx.fillStyle="#050b28aa";ctx.fillRect(bx,H-130-bh,125,bh)}
 ctx.save();ctx.translate(-cameraX,0);
 platforms.forEach(p=>{const gg=ctx.createLinearGradient(0,p.y,0,p.y+p.h);gg.addColorStop(0,p.h>30?"#334155":"#64748b");gg.addColorStop(1,"#172033");ctx.fillStyle=gg;rr(p.x,p.y,p.w,p.h,p.h>30?14:8);ctx.fillStyle="#a5b4fc";ctx.fillRect(p.x,p.y,p.w,4)});
 coins.forEach(c=>{if(!c.taken){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(time*.08+c.x)*.18);ctx.fillStyle="#facc15";ctx.beginPath();ctx.ellipse(0,0,c.r*.7,c.r,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fde68a";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#92400e";ctx.font="bold 14px Arial";ctx.textAlign="center";ctx.fillText("★",0,5);ctx.restore()}});
 gems.forEach(g=>{if(!g.taken){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(time*.025);ctx.fillStyle="#a78bfa";ctx.beginPath();ctx.moveTo(0,-g.r);ctx.lineTo(g.r*.8,-g.r*.25);ctx.lineTo(g.r*.55,g.r*.75);ctx.lineTo(0,g.r);ctx.lineTo(-g.r*.55,g.r*.75);ctx.lineTo(-g.r*.8,-g.r*.25);ctx.closePath();ctx.fill();ctx.strokeStyle="#ddd6fe";ctx.stroke();ctx.restore()}});
 enemies.forEach(e=>{if(e.type==="flyer"){ctx.fillStyle="#c026d3";rr(e.x,e.y,e.w,e.h,15);ctx.fillStyle="#f0abfc";ctx.fillRect(e.x+7,e.y+13,9,7);ctx.fillRect(e.x+32,e.y+13,9,7);ctx.fillStyle="#581c87";ctx.fillRect(e.x+12,e.y+28,24,4)}else{ctx.fillStyle=e.type==="jumper"?"#ea580c":"#b91c1c";rr(e.x,e.y,e.w,e.h,12);ctx.fillStyle=e.type==="jumper"?"#fb923c":"#ef4444";rr(e.x+5,e.y+6,e.w-10,e.h-11,9);ctx.fillStyle="#fff";ctx.fillRect(e.x+9,e.y+16,7,7);ctx.fillRect(e.x+28,e.y+16,7,7);ctx.fillStyle="#111827";ctx.fillRect(e.x+12,e.y+37,20,4)}});
